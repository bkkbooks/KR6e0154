body:
  text: 每日清晨入壇諸品經呪普回向畢主經者起香讚大衆起立同聲念香讚爐香乍爇法界蒙熏華嚴海會悉遙聞隨處結祥雲誠意方殷諸佛現全身主經出琲白云遮那妙體遍法界以為身華藏莊嚴等太虗而為量維此法會不異寂場極依正以常融在聖凡而靡間初成正覺現神變於菩提場中再轉法輪震圓音於普光明殿遍七處而恆演歷九會以同宣敷萬行之因華嚴一乘之道果謹遵教典大啓法筵仰祝皇圖鞏固帝道遐昌佛日增輝法輪常轉十方施主增益福田法界衆生同圓種智主歸位南無華嚴教主盧舍那佛三念開經偈無上甚深微妙法百千萬億難遭遇我今見聞得受持願解如來真實義起經卷卷經畢念補鬧真言舉讚或唱字母竟略回向云願以此功德普及於一切我等與衆生皆共成佛道後皆倣此總回向文稽首華嚴真性海種種光明遍照尊普賢萬行所莊嚴一切真如法界藏龍樹龍宮親誦憶實叉于闐闡微言一乘圓頓妙法門見性成佛真祕典手捧目觀心口誦當知夙有大因緣見聞隨喜發菩提究竟圓成薩婆若十方三世一切佛諸尊菩薩摩訶薩摩訶般若波羅蜜或拜行願品或禮華嚴文宣疏起止竟隨州大洪山遂禪師禮華嚴經文南無毗盧教主華藏慈尊演寶偈之經文布琅函之玉軸塵塵混入剎剎圓融十兆九萬五千四十八字一乘圓教大方廣佛華嚴經若人欲了知三世一切佛應觀法界性一切惟心造常願供養常恭敬七處九會佛菩薩常願證入常宣說五周四分華嚴經常願供養無休歇九十剎塵菩薩衆常願悟入常宣說大方廣佛華嚴經伏願某甲生生世世在在處處眼中常見如是經典耳中常聞如是經典口中常誦如是經典手中常書如是經典心中常悟如是經典願生生世世在在處處常得親近華藏一切聖賢常蒙華藏一切聖賢慈悲攝受如經所說願悉證明願如善財菩薩願如文殊師利菩薩願如彌勒菩薩願如普賢菩薩願如觀世音菩薩願如毗盧遮那佛以此稱經功德以此發願功德願與四恩三有法界一切衆生消無始以來盡法界虗空界無量罪垢願與四恩三有法界一切衆生解無始以來盡法界虗空界無量冤業願與四恩三有法界一切衆生集無始以來盡法界虗空界無量福智同遊華藏莊嚴海共入菩提大道場南無大方廣佛華嚴經
